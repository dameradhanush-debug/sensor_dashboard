<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Application</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="container">

        <h1>My To-Do List</h1>


        <!-- Input Section -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task"
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Fetch Button -->
        <button id="fetchButton">
            Load Sample Tasks
        </button>


        <!-- Task List -->
        <ul id="taskList">

        </ul>

    </div>


    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
