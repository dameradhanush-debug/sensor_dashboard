<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
		body { background: lightblue; font-family: Arial; }
		form { background: white; padding: 20px; margin: 20px auto; max-width: 350px; }
		input, button { width: 100%; padding: 8px; margin: 6px 0; }
	</style>
</head>
<body>
	<h1>Login</h1>
	<form>
		<h2>Login</h2>
		<input type="email" placeholder="Email" required>
		<input type="password" placeholder="Password" required>
		<button>Login</button>
	</form>
</body>
</html>
